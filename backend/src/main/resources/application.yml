# Defaults for local runs. Every value is overridden by its APP_* environment variable.
app:
  storage-dir: ./storage
  max-file-size-mb: 20
  max-files-per-upload: 10
  search-timeout-ms: 900
  search-max-page-size: 50
  worker-concurrency: 4
  stuck-processing-minutes: 10
  sse-heartbeat-ms: 15000

spring:
  application:
    name: technical-test-davivienda
  threads:
    virtual:
      enabled: true

server:
  port: ${API_PORT:8081}
  servlet:
    context-path: /api

# Actuator is mounted at the context root so health is served as /api/health.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
