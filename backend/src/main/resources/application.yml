spring:
  application:
    name: technical-test-davivienda
  threads:
    virtual:
      enabled: true

server:
  port: ${API_PORT:8081}
  servlet:
    context-path: /api

# Actuator is mounted at the context root so health is served as /api/health.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
