name: technical-test-davivienda

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - '${RABBITMQ_PORT}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: api
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOGGING_STRUCTURED_FORMAT_CONSOLE}
      API_PORT: 8081
      APP_STORAGE_DIR: /app/storage
      APP_MAX_FILE_SIZE_MB: ${APP_MAX_FILE_SIZE_MB}
      APP_MAX_FILES_PER_UPLOAD: ${APP_MAX_FILES_PER_UPLOAD}
      APP_SEARCH_TIMEOUT_MS: ${APP_SEARCH_TIMEOUT_MS}
      APP_SEARCH_MAX_PAGE_SIZE: ${APP_SEARCH_MAX_PAGE_SIZE}
      APP_WORKER_CONCURRENCY: ${APP_WORKER_CONCURRENCY}
      APP_STUCK_PROCESSING_MINUTES: ${APP_STUCK_PROCESSING_MINUTES}
      APP_SSE_HEARTBEAT_MS: ${APP_SSE_HEARTBEAT_MS}
      APP_SSE_TIMEOUT_MS: ${APP_SSE_TIMEOUT_MS}
    ports:
      - '${API_PORT}:8081'
    volumes:
      - documents-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8081/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # The same image as the api with the HTTP side switched off: parsing is CPU bound and must not
  # compete with request threads. It waits for the api because only the api migrates the schema,
  # and it shares the uploads volume because it reads the files the api stored.
  worker:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: worker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOGGING_STRUCTURED_FORMAT_CONSOLE}
      APP_STORAGE_DIR: /app/storage
      APP_MAX_FILE_SIZE_MB: ${APP_MAX_FILE_SIZE_MB}
      APP_MAX_FILES_PER_UPLOAD: ${APP_MAX_FILES_PER_UPLOAD}
      APP_SEARCH_TIMEOUT_MS: ${APP_SEARCH_TIMEOUT_MS}
      APP_SEARCH_MAX_PAGE_SIZE: ${APP_SEARCH_MAX_PAGE_SIZE}
      APP_WORKER_CONCURRENCY: ${APP_WORKER_CONCURRENCY}
      APP_STUCK_PROCESSING_MINUTES: ${APP_STUCK_PROCESSING_MINUTES}
      APP_SSE_HEARTBEAT_MS: ${APP_SSE_HEARTBEAT_MS}
      APP_SSE_TIMEOUT_MS: ${APP_SSE_TIMEOUT_MS}
    volumes:
      - documents-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    # The worker serves no HTTP, so this can only report that the process is alive. It is still
    # worth having: it is the process that does all the work, and a crashed one is otherwise silent.
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f app.jar > /dev/null']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # nginx serves the built SPA and proxies /api to the api service, so the browser talks to one
  # origin and needs no CORS. It is the only service a reverse proxy in front has to reach.
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '${WEB_PORT}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  rabbitmq-data:
  documents-storage:
