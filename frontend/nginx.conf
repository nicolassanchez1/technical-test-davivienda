# Serves the built SPA and puts the API behind the same origin, so the browser needs no CORS and
# the SPA can keep using relative /api paths in every environment.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The event stream has to reach the browser as it is written. With buffering left on, nginx
    # holds the response until its own buffer fills, and a feed of small status events then arrives
    # late or not at all. The kept-alive upstream connection and the emptied Connection header are
    # what let the stream stay open, and the read timeout matches APP_SSE_TIMEOUT_MS so nginx is
    # never the side that hangs up first.
    location /api/events {
        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Derived the way the API derives its own limit, APP_MAX_FILE_SIZE_MB times
        # APP_MAX_FILES_PER_UPLOAD plus headroom, so a batch the API would have accepted is never
        # cut off here with a response that is not problem+json.
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Hashed filenames, so a browser may keep them for as long as it likes.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry point must never be cached, or a deploy leaves clients on the previous bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: an unknown path is a route of the SPA, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
